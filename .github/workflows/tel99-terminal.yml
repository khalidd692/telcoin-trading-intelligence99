name: TEL99 Quant Terminal verification
on:
  pull_request:
    branches: [codex/tel99-quant-terminal]
    paths:
      - 'src/terminal/**'
      - 'scripts/terminal/**'
      - 'site/terminal/**'
      - 'research/terminal/**'
      - 'results/terminal/**'
      - 'tests/test_terminal*'
      - '.github/workflows/tel99-terminal.yml'
  push:
    branches: [codex/tel99-quant-terminal]
    paths:
      - 'src/terminal/**'
      - 'scripts/terminal/**'
      - 'site/terminal/**'
      - 'research/terminal/**'
      - 'results/terminal/**'
      - 'tests/test_terminal*'
      - '.github/workflows/tel99-terminal.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tel99-terminal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python and collector regression
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s collector -p 'test_*.py' -v
      - name: Browser logic and legacy dashboard regression
        run: |
          node --check site/terminal/app.js
          node tests/test_terminal.js
          node --test tests/test_terminal_scenarios.js tests/test_terminal_worker.js
          node tests/test_dashboard.js
          node tests/test_realtime.js
      - name: Deterministic terminal build
        run: |
          python -m scripts.terminal.build --market-input research/terminal/raw/kraken_2026-11-10_refresh.json --output /tmp/tel99-determinism-1.json --no-study-write
          python -m scripts.terminal.build --market-input research/terminal/raw/kraken_2026-11-10_refresh.json --output /tmp/tel99-determinism-2.json --no-study-write
          cmp /tmp/tel99-determinism-1.json /tmp/tel99-determinism-2.json
          git diff --exit-code -- site/terminal/data.json results/terminal/experiments.json
      - name: Package portable static terminal
        run: |
          cd site/terminal
          zip -qr ../../TEL99-terminal.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: TEL99-terminal-${{ github.sha }}
          path: TEL99-terminal.zip
          retention-days: 14
      - name: Summary
        run: |
          echo 'Terminal tested and packaged; no deployment, no account access, no orders.' >> "$GITHUB_STEP_SUMMARY"

  live-kraken-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read six public Kraken feeds into temporary capture
        run: python -m scripts.terminal.collect --output /tmp/tel99-live-kraken.json
      - name: Build fresh snapshot without rewriting frozen experiments
        run: python -m scripts.terminal.build --market-input /tmp/tel99-live-kraken.json --output /tmp/tel99-live-snapshot.json --no-study-write
      - name: Verify fresh data, invariants and absence of repository mutations
        run: |
          python - <<'PY'
          import json, time
          from pathlib import Path
          old=json.loads(Path('site/terminal/data.json').read_text())
          new=json.loads(Path('/tmp/tel99-live-snapshot.json').read_text())
          assert new['schema_version']==1 and new['market']=='KRAKEN:TELUSD'
          assert new['source']=='Kraken public REST / OHLC'
          assert set(new['frames'])=={'15m','1h','4h','1D'}
          assert set(new['context'])=={'btc4h','eth4h'}
          assert new['lab']==old['lab'], 'Frozen research changed'
          assert new['safety']==old['safety']
          assert new['research_source_sha256']==old['research_source_sha256']
          assert new['safety']['real_orders'] is False and new['safety']['paper_orders'] is False
          assert abs(time.time()-new['as_of'])<900, 'Capture is stale or future-dated'
          for tf,frame in new['frames'].items():
              assert frame['symbol']=='KRAKEN:TELUSD' and frame['interval']==tf
              assert frame['quality']['valid_bars']>0
              assert frame['quality']['last_close']<=new['as_of']
          print('Live Kraken read-only collection and market build verified')
          PY
          git diff --exit-code -- research/terminal/ results/terminal/ site/terminal/data.json
      - name: Package isolated terminal preview with the verified live snapshot
        run: |
          cp /tmp/tel99-live-snapshot.json site/terminal/data.json
          cd site/terminal
          zip -qr /tmp/TEL99-live-preview.zip .
      - name: HTTP smoke test of isolated preview bundle
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory site/terminal >/tmp/tel99-preview-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          base='http://127.0.0.1:8765/'
          for _ in range(30):
              try:
                  with urllib.request.urlopen(base+'index.html',timeout=2) as response:
                      page=response.read().decode()
                  break
              except Exception:
                  time.sleep(.2)
          else:
              raise AssertionError('Preview HTTP server did not start')
          assert 'TEL99' in page and 'app.js' in page
          with urllib.request.urlopen(base+'data.json',timeout=5) as response:
              live=json.load(response)
          expected=json.loads(Path('/tmp/tel99-live-snapshot.json').read_text())
          assert live==expected, 'Preview HTTP snapshot differs from validated capture'
          for asset in ('app.js','core.js','terminal.css'):
              with urllib.request.urlopen(base+asset,timeout=5) as response:
                  assert response.status==200 and len(response.read())>100
          print('Preview HTTP smoke test passed with exact validated Kraken snapshot')
          PY
      - name: Upload private ready-to-preview terminal
        uses: actions/upload-artifact@v4
        with:
          name: TEL99-live-preview-${{ github.sha }}
          path: /tmp/TEL99-live-preview.zip
          retention-days: 3
      - name: Preserve validated snapshot as private Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: TEL99-live-kraken-${{ github.sha }}
          path: /tmp/tel99-live-snapshot.json
          retention-days: 3
