name: TEL99 live market snapshots
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  workflow_call:
  workflow_run:
    workflows: ["TEL99 hourly read-only validation"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ['.github/workflows/tel99-live-publication.yml']
permissions:
  contents: write
concurrency:
  group: tel99-live-data
  cancel-in-progress: false
jobs:
  publish:
    # Monitor completion and hourly validation provide independent fallback triggers when GitHub cron is delayed.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/tel99-quant-terminal
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public Kraken data
        run: python -m scripts.terminal.collect --output /tmp/tel99-capture.json
      - name: Compute and validate snapshot
        run: |
          python -m scripts.terminal.build --market-input /tmp/tel99-capture.json --output /tmp/tel99-snapshot.json --no-study-write
          python - <<'PY'
          import datetime,json,time,os
          from pathlib import Path
          p=Path('/tmp/tel99-snapshot.json')
          d=json.loads(p.read_text())
          baseline=json.loads(Path('site/terminal/data.json').read_text())
          assert d['schema_version']==1 and d['market']=='KRAKEN:TELUSD'
          assert d['source']=='Kraken public REST / OHLC'
          assert d['lab']==baseline['lab'] and d['research_source_sha256']==baseline['research_source_sha256']
          assert d['safety']==baseline['safety'] and not d['safety']['real_orders'] and not d['safety']['paper_orders']
          assert 0<=time.time()-d['as_of']<600
          assert set(d['frames'])=={'15m','1h','4h','1D'} and set(d['context'])=={'btc4h','eth4h'}
          for f in d['frames'].values():
              assert f['quality']['last_close']<=d['as_of']
          d['publication']={'event':os.environ['GITHUB_EVENT_NAME'],'run_id':os.environ['GITHUB_RUN_ID'],'run_url':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],'cadence':'5-minute cron best effort; existing monitor completion fallback (~13 minutes)'}
          d['published_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          p.write_text(json.dumps(d,ensure_ascii=False,allow_nan=False,separators=(',',':'))+'\n')
          PY
      - name: Publish complete snapshot atomically
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Re-read the latest publication branch on each attempt. Never force-push.
          # A delayed older capture must never overwrite a newer capture.
          for attempt in 1 2 3; do
            git fetch origin tel99-live-data
            git switch -C tel99-live-data origin/tel99-live-data
            python - <<'PY'
          import json
          from pathlib import Path
          new=json.loads(Path('/tmp/tel99-snapshot.json').read_text())
          current=json.loads(Path('site/terminal/data.json').read_text())
          if current.get('as_of',0)>=new['as_of']:
              print('Current published snapshot is at least as fresh; nothing to overwrite.')
              Path('/tmp/tel99-skip-publish').touch()
          PY
            if [ -f /tmp/tel99-skip-publish ]; then exit 0; fi
            cp /tmp/tel99-snapshot.json site/terminal/data.json
            git add site/terminal/data.json
            git commit -m "data: refresh TEL99 public snapshot"
            if git push origin HEAD:tel99-live-data; then exit 0; fi
            echo "Concurrent publisher advanced branch; retrying from latest head."
            sleep 2
          done
          echo "::error::Could not publish after 3 safe attempts."
          exit 1
      - name: Publish decision and market-data evidence in Actions summary
        if: always()
        run: |
          python - <<'PY'
          import json,os,datetime
          from pathlib import Path
          p=Path('/tmp/tel99-snapshot.json')
          lines=['## TEL99 — état de la publication et de l’analyse']
          if not p.is_file():
              lines+=['**DONNÉES INSUFFISANTES** : aucune capture Kraken validée. Aucun ordre.']
          else:
              d=json.loads(p.read_text())
              decision=d.get('decision',{})
              lines += [
                  f"- Capture UTC : {datetime.datetime.fromtimestamp(d['as_of'],datetime.timezone.utc).isoformat()}",
                  f"- Décision expérimentale : **{decision.get('status','DONNÉES INSUFFISANTES')}**",
                  '- Stratégie statistiquement validée : **NON**',
                  '- Frais personnels et spread vérifiés : **NON**',
                  '- Ordres réels et paper : **DÉSACTIVÉS**',
              ]
              for tf in ('15m','1h','4h','1D'):
                  frame=d.get('frames',{}).get(tf,{})
                  q=frame.get('quality',{})
                  last=frame.get('latest',{})
                  lines.append(f"- {tf} : {q.get('valid_bars','?')} bougies valides ; clôture {last.get('close','?')} USD ; tendance {last.get('trend','?')}")
              if decision.get('contradictions'):
                  lines += ['### Freins à l’achat']+['- '+str(x) for x in decision['contradictions']]
              lines += ['**Attention :** les niveaux sont des observations, pas des ordres prêts à placer.']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('\n'.join(lines)+'\n')
          PY
