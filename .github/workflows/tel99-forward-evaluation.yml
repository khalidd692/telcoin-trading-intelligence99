name: TEL99 read-only forward evaluation
# Read-only; tested before publishing, never connects to broker accounts.
# Run tests before writing evidence.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  workflow_call:
  workflow_run:
    workflows: ["TEL99 live market snapshots"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ['.github/workflows/tel99-forward-evaluation.yml']
permissions:
  contents: write
concurrency:
  group: tel99-evaluation-journal
  cancel-in-progress: false
jobs:
  observe:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read the product radar
        run: |
          git fetch origin codex/tel99-quant-terminal
          git worktree add --detach /tmp/tel99-radar FETCH_HEAD
          node --test /tmp/tel99-radar/tests/test_terminal_radar.js
      - name: Regression tests
        run: python -m unittest discover -s tests -p 'test_tel99_forward_evaluation.py'
      - name: Retrieve previous observations
        run: |
          git fetch origin tel99-evaluation-data
          mkdir -p /tmp/tel99-evaluation
          git show origin/tel99-evaluation-data:evaluation/observations.csv > /tmp/tel99-evaluation/observations.csv.tmp
          test -s /tmp/tel99-evaluation/observations.csv.tmp
          mv /tmp/tel99-evaluation/observations.csv.tmp /tmp/tel99-evaluation/observations.csv
          for name in outcomes.jsonl events.jsonl observation_metadata.jsonl; do
            if git cat-file -e "origin/tel99-evaluation-data:evaluation/$name" 2>/dev/null; then
              git show "origin/tel99-evaluation-data:evaluation/$name" > "/tmp/tel99-evaluation/$name.tmp"
              mv "/tmp/tel99-evaluation/$name.tmp" "/tmp/tel99-evaluation/$name"
            fi
          done
      - name: Observe and score matured horizons (no trades)
        run: |
          python scripts/terminal/evaluate_observations.py --journal /tmp/tel99-evaluation/observations.csv --report /tmp/tel99-evaluation/summary.json --radar /tmp/tel99-radar/site/terminal/radar.js
      - name: Publish journal on separate evidence branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C tel99-evaluation-data origin/tel99-evaluation-data
          mkdir -p evaluation
          cp /tmp/tel99-evaluation/observations.csv evaluation/observations.csv
          cp /tmp/tel99-evaluation/summary.json evaluation/summary.json
          for name in outcomes.jsonl events.jsonl observation_metadata.jsonl; do
            if [ -f "/tmp/tel99-evaluation/$name" ]; then cp "/tmp/tel99-evaluation/$name" "evaluation/$name"; fi
          done
          git add evaluation/observations.csv evaluation/summary.json evaluation/*.jsonl
          if ! git diff --cached --quiet; then
            git commit -m 'data: record read-only TEL99 forward observation'
            git push origin HEAD:tel99-evaluation-data
          fi
      - name: Explain limits
        if: always()
        run: |
          echo '### TEL99 forward observation (read-only)' >> "$GITHUB_STEP_SUMMARY"
          echo 'No orders, no paper trades, no claimed trading profitability.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Outcomes are close-to-close price returns at 1h, 4h, 24h and 7d; missing horizons are explicitly marked.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/tel99-evaluation/summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/tel99-evaluation/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
