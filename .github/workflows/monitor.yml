name: TEL market monitor and website

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write
  # Necessaire pour la auto-relance de la publication (declenchement
  # workflow_dispatch par le jeton de l'execution). Le jeton reste limite a
  # ce depot et a cette seule action.
  actions: write

concurrency:
  group: telcoin-market-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'pull_request' && 'test' || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record the checked-out commit (provenance of the publication)
        run: echo "CHECKOUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Generate collection ID
        id: collection_id
        run: |
          COLLECTION_ID=$(python -c "import uuid; print(uuid.uuid4())")
          echo "collection_id=$COLLECTION_ID" >> $GITHUB_OUTPUT
          echo "COLLECTION_ID=$COLLECTION_ID" >> $GITHUB_ENV
      - name: Check generated collection ID is non-empty
        run: |
          if [ -z "${{ steps.collection_id.outputs.collection_id }}" ]; then
            echo "Missing collection_id output from generation step" >&2
            exit 1
          fi
          echo "collection_id=${{ steps.collection_id.outputs.collection_id }}"
      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s collector -p "test_*.py" -v
          node tests/test_dashboard.js
          node tests/test_realtime.js
      - name: Collect public market data
        id: collect
        continue-on-error: true
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          # Retry transient API/network failures. The final outcome still fails closed.
          for attempt in 1 2 3; do
            echo "Public market collection attempt ${attempt}/3"
            if python -m src.monitor --output site/report.json --collection-id "${{ steps.collection_id.outputs.collection_id }}"; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "Public market collection failed after 3 attempts."
          exit 1
      - name: Ensure fail-closed report exists
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from src.monitor import fallback_report

          path = Path("site/report.json")
          valid = False
          if path.is_file() and path.stat().st_size:
              try:
                  report = json.loads(path.read_text(encoding="utf-8"))
                  valid = (isinstance(report, dict)
                           and report.get("schema_version") == 1
                           and report.get("symbol") == "TELUSDT"
                           and report.get("mode") == "READ_ONLY_ALERTS"
                           and report.get("status") in {"SURVEILLER", "ATTENDRE"}
                           and isinstance(report.get("generated_at"), str)
                           and isinstance(report.get("sources"), dict)
                           and isinstance(report.get("checks"), list))
                  if os.environ.get("COLLECT_OUTCOME") != "success" and report.get("status") == "SURVEILLER":
                      valid = False
              except (OSError, UnicodeError, json.JSONDecodeError):
                  pass
          if not valid:
              path.write_text(json.dumps(
                  fallback_report("Collector produced no valid schema-v1 report."),
                  indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
      - name: Collect detailed public TEL market data (read-only)
        id: detailed_collect
        continue-on-error: true
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          # Remove any committed snapshot before collection so a failed run cannot reuse it.
          rm -f site/tel_snapshot.json
          # Retry transient API/network failures; never fall back to a prior snapshot.
          for attempt in 1 2 3; do
            echo "Detailed TEL collection attempt ${attempt}/3"
            rm -f site/tel_snapshot.json
            if python collector/tel_collector.py --out site/tel_snapshot.json --passes 3 --interval 3 --notional 300 --collection-id "${{ steps.collection_id.outputs.collection_id }}"; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "Detailed TEL collection failed after 3 attempts."
          exit 1
      - name: Ensure detailed snapshot exists and is valid JSON
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DETAILED_COLLECT_OUTCOME: ${{ steps.detailed_collect.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path("site/tel_snapshot.json")
          # Never republish a previously committed market snapshot as if it were fresh.
          # Any collector failure forces an explicit unavailable/fail-closed snapshot.
          valid = False
          if os.environ.get("DETAILED_COLLECT_OUTCOME") == "success" and p.is_file() and p.stat().st_size:
              try:
                  d = json.loads(p.read_text(encoding="utf-8"))
                  valid = (isinstance(d, dict) and d.get("schema_version") == 1
                           and d.get("symbol") == "TELUSDT"
                           and isinstance(d.get("sources"), dict)
                           and isinstance(d.get("request_log"), list))
              except (OSError, UnicodeError, json.JSONDecodeError):
                  pass
          if not valid:
              p.write_text(json.dumps({
                  "schema_version": 1, "symbol": "TELUSDT",
                  "mode": "READ_ONLY_PUBLIC_DATA", "generated_at": None,
                  "collection_status": "FALLBACK",
                  "collector": {"read_only": True, "orders_sent": 0},
                  "sources": {
                      "mexc": {"status": {"book": {"verdict": "ERREUR", "reason": "snapshot absent/invalide"}, "trades": {"verdict": "ERREUR", "reason": "snapshot absent/invalide"}}},
                      "kucoin": {"status": {"book": {"verdict": "ERREUR", "reason": "snapshot absent/invalide"}, "trades": {"verdict": "ERREUR", "reason": "snapshot absent/invalide"}}}
                  },
                  "cross_check": {"independent_confirmation": "NON ÉTABLIE"},
                  "request_log": [], "error": "Collecteur détaillé en échec, absent ou JSON invalide; aucune donnée de marché n'est inventée.",
                  "collection_outcome": os.environ.get("DETAILED_COLLECT_OUTCOME", "unknown")
              }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Generate read-only multi-timeframe analysis
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python -m src.agent_analysis --input site/tel_snapshot.json --output site/agent_analysis.json --collection-id "${{ steps.collection_id.outputs.collection_id }}"
      - name: Track reversal alerts (persistence, deduplication, resolution)
        id: alert_tracking
        continue-on-error: true
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          # Etat persistant des alertes de retournement :
          #  - une alerte qui se prolonge n'est PAS re-emise a chaque execution ;
          #  - une panne de flux ou un instantane perime ne resout JAMAIS une alerte ;
          #  - l'etat est ecrit de facon atomique et relu apres redemarrage.
          # Cette etape est un aidant au suivi : elle ne doit jamais bloquer la
          # publication, d'ou continue-on-error.
          mkdir -p alerts
          python -m src.alert_state --input site/agent_analysis.json --state alerts/alert_state.json --output alerts/last_decision.json --ledger alerts/prospective.jsonl
          echo "### Alerte de retournement" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path("alerts/last_decision.json")
          lines = []
          if p.is_file():
              try:
                  d = json.loads(p.read_text(encoding="utf-8"))
              except (OSError, UnicodeError, json.JSONDecodeError):
                  d = {}
              lines.append(f"- action : **{d.get('action')}**")
              lines.append(f"- raison : {d.get('reason')}")
              a = d.get("alert") or {}
              if a:
                  lines.append(f"- signal : {a.get('signal_status')} / {a.get('direction')} / "
                               f"ancrage {a.get('anchor')} / confiance {a.get('confidence')}")
                  lines.append(f"- exploitable : {a.get('exploitable')} ({a.get('exploitable_reason')})")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as stream:
                  stream.write("\n".join(lines) + "\n")
          else:
              print("\n".join(lines))
          PY
      - name: Validate collection provenance before publication
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          COLLECTION_ID: ${{ env.COLLECTION_ID }}
        run: python -m src.publication_gate --root . --collection-id "${{ env.COLLECTION_ID }}"
      - name: Commit the exact published reports to main
        id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p alerts
          git add site/report.json site/tel_snapshot.json site/agent_analysis.json alerts/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh published TEL/USDT market report [skip ci]"
            git push origin HEAD:main
          fi
      - name: Add report reference to summary
        if: always()
        run: |
          echo "# TEL/USDT market dashboard" >> "$GITHUB_STEP_SUMMARY"
          echo "The report and actual source checks are shown on the deployed dashboard." >> "$GITHUB_STEP_SUMMARY"
          echo "A missing or invalid data feed must remain ATTENDRE." >> "$GITHUB_STEP_SUMMARY"
          echo "Detailed snapshot: site/tel_snapshot.json (multi-timeframe, order book, trades, spread and 300 USDT slippage estimate)." >> "$GITHUB_STEP_SUMMARY"
          echo "Read-only agent analysis: site/agent_analysis.json (15m, 1h, 4h, 1d, 1w, 1M)." >> "$GITHUB_STEP_SUMMARY"
          echo "Detailed collector outcome: ${{ steps.detailed_collect.outcome }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Enable and read GitHub Pages configuration
        uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          enablement: true
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - name: Keep the publication cadence (auto re-dispatch)
        id: cadence
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Le cron de GitHub est fortement bridé sur ce dépôt : cadence observée
          # ~3 h 49 pour un */15 configuré (45 exécutions planifiées sur 168 h).
          # Chaque publication relance donc la suivante, mais seulement si la
          # dernière publication a plus de 12 minutes : la chaîne est
          # auto-limitée, ne déclenche rien si une publication récente existe, et
          # s'arrête d'elle-même si une exécution échoue (intervalle de 45 min
          # dans ce cas, pour ne pas boucler sur une panne).
          if [ "${{ steps.publish.outcome }}" = "success" ]; then
            python -m src.publication_cadence --min-interval-min 12 --ref main --workflow monitor.yml
          else
            python -m src.publication_cadence --min-interval-min 45 --ref main --workflow monitor.yml
          fi
      - name: Mark failed collection as workflow failure
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (steps.collect.outcome != 'success' || steps.detailed_collect.outcome != 'success')
        run: |
          echo "At least one market collection failed; fail-closed reports were published."
          exit 1
