name: TEL market monitor and website

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: telcoin-market-monitor
  cancel-in-progress: true

jobs:
  monitor-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Collect public market data
        id: collect
        continue-on-error: true
        run: python -m src.monitor --output site/report.json
      - name: Ensure fail-closed report exists
        if: always()
        run: |
          if [ ! -s site/report.json ]; then
            printf '%s\n' '{"schema_version":1,"generated_at":null,"symbol":"TELUSDT","mode":"READ_ONLY_ALERTS","status":"ATTENDRE","sources":{"mexc_ticker":{"status":"UNAVAILABLE","reason":"Collector did not return a report"},"mexc_candles":{"status":"UNAVAILABLE","reason":"Collector did not return a report"},"kucoin_level1":{"status":"UNAVAILABLE","reason":"Collector did not return a report"}},"checks":[{"name":"Collection pipeline","status":"FAIL","reason":"No valid report produced; fail-closed"}],"indicators":null,"error":"No market report was produced by the collector.","disclaimer":"Read-only monitoring. No orders. No profitability claims."}' > site/report.json
          fi
      - name: Add report reference to summary
        if: always()
        run: |
          echo "# TEL/USDT market dashboard" >> "$GITHUB_STEP_SUMMARY"
          echo "The report and actual source checks are shown on the deployed dashboard." >> "$GITHUB_STEP_SUMMARY"
          echo "A missing or invalid data feed must remain ATTENDRE." >> "$GITHUB_STEP_SUMMARY"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
