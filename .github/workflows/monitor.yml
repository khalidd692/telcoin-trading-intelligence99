name: TEL market monitor and website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: telcoin-market-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'pull_request' && 'test' || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v
          node tests/test_dashboard.js
          node tests/test_realtime.js
      - name: Optional live Kraken public market-data smoke test
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python -m scripts.kraken_live_smoke
      - name: Collect public market data
        id: collect
        continue-on-error: true
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python -m src.monitor --output site/report.json
      - name: Ensure fail-closed report exists
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from src.monitor import fallback_report

          path = Path("site/report.json")
          valid = False
          if path.is_file() and path.stat().st_size:
              try:
                  report = json.loads(path.read_text(encoding="utf-8"))
                  valid = (isinstance(report, dict)
                           and report.get("schema_version") == 1
                           and report.get("symbol") == "TELUSD"
                           and report.get("mode") == "READ_ONLY_ALERTS"
                           and report.get("status") in {"SURVEILLER", "ATTENDRE"}
                           and isinstance(report.get("generated_at"), str)
                           and isinstance(report.get("sources"), dict)
                           and isinstance(report.get("checks"), list))
                  if os.environ.get("COLLECT_OUTCOME") != "success" and report.get("status") == "SURVEILLER":
                      valid = False
              except (OSError, UnicodeError, json.JSONDecodeError):
                  pass
          if not valid:
              path.write_text(json.dumps(
                  fallback_report("Collector produced no valid schema-v1 report."),
                  indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
      - name: Commit the exact published report to main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/report.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh published TEL/USD market report [skip ci]"
            git push origin HEAD:main
          fi
      - name: Add report reference to summary
        if: always()
        run: |
          echo "# TEL/USD market dashboard" >> "$GITHUB_STEP_SUMMARY"
          echo "The report and actual source checks are shown on the deployed dashboard." >> "$GITHUB_STEP_SUMMARY"
          echo "A missing or invalid data feed must remain ATTENDRE." >> "$GITHUB_STEP_SUMMARY"
      - name: Enable and read GitHub Pages configuration
        uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          enablement: true
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - name: Mark failed collection as workflow failure
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.collect.outcome != 'success'
        run: |
          echo "Market collection failed; the fail-closed ATTENDRE report was published."
          exit 1
